.pedido.pronto,.fabrica-card.pronto{border:2px solid #16844a!important;border-left-width:7px!important;background:#f1fbf4}
.pedido.urgente,.fabrica-card.urgente{border:2px solid #b91c1c!important;border-left-width:8px!important;background:#fff8f7;animation:alertaUrgenteBorda 1.15s ease-in-out infinite}
.tag-urgente{background:#b91c1c!important;color:#fff!important;border:1px solid #7f1d1d;letter-spacing:.7px;font-size:11px!important;font-weight:900!important;padding:5px 10px!important;box-shadow:0 1px 5px rgba(127,29,29,.28);animation:piscarUrgente 1.15s ease-in-out infinite}
.fabrica-card.urgente .fabrica-status:not(.pronto){background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
@media(prefers-reduced-motion:reduce){.pedido.urgente,.fabrica-card.urgente,.tag-urgente{animation:none!important}}



.btn-nao-caixa{align-self:flex-start;border:1px solid #b91c1c;border-radius:8px;background:#fff;color:#991b1b;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.2px}.btn-nao-caixa[aria-pressed="true"]{background:#991b1b;color:#fff;box-shadow:0 0 0 2px #fee2e2}


.itens-temp li>span:last-child{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.item-editar{border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#374151;padding:7px 10px;font-size:11px;font-weight:800}.item-apagar-x{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;padding:0!important;border:1px solid #fecaca!important;border-radius:8px!important;background:#fff1f2!important;color:#dc2626!important;font-size:24px!important;line-height:1;font-weight:800!important}.item-apagar-x:hover{background:#fee2e2!important;color:#991b1b!important}
@media(max-width:899px){.itens-temp li>span:last-child{width:100%;justify-content:flex-end}.item-editar{min-height:34px}.item-apagar-x{min-height:36px}}

@media print{
  @page{size:A4 portrait;margin:10mm}
  #printArea{font-size:10pt!important}
  .pdf-header{margin-bottom:10px;padding-bottom:7px}
  .pdf-brand{font-size:16pt!important}
  .pdf-title{font-size:10pt!important}
  .pdf-header .pdf-sub{font-size:8.5pt!important;line-height:1.35}
  .pdf-pedido{padding:7px 9px;margin-bottom:7px}
  .pdf-pedido-top{gap:4px 8px;padding-bottom:5px;margin-bottom:5px}
  .pdf-cliente{font-size:11pt!important}
  .pdf-urgente{font-size:8pt!important;padding:3px 6px}
  .pdf-data{font-size:8.5pt!important;line-height:1.3}
  .pdf-tab{font-size:9.5pt!important}
  .pdf-tab th,.pdf-tab td{padding:4px 5px;line-height:1.25}
  .pdf-tab th{font-size:8pt!important}
  .pdf-tab .tag-bitola{font-size:9pt!important}
  .pdf-info,.pdf-informacoes{font-size:8.5pt!important;line-height:1.3;margin-top:5px}

}

      entregueEm:data.entregueEm ?? null,
      temEstribo:true,
      itens:(data.itens || []).filter(item => item.tipo !== 'outro').map(item => ({
        tipo:'estribo', medida:item.medida, material:item.material, qtd:item.qtd, pronto:item.pronto === true

            urgente:data.urgente === true,
            pronto:data.pronto === true,
            entregue:data.entregue === true
          };
        };
        const pedidos = snapshot.docs.map(normalizarPedido);
          const novos = [];
          const prontosAgora = [];
          if (!primeiraLeitura){
            snapshot.docChanges().forEach(change => {
              const atual = normalizarPedido(change.doc);
              if (change.type === 'added') novos.push(atual);
              if (change.type === 'modified' && atual.pronto === true && anteriores.get(change.doc.id)?.pronto !== true) prontosAgora.push(atual);
            });
          }
          anteriores.clear();
          pedidos.forEach(pedido => anteriores.set(pedido.id, pedido));
          next(pedidos, {novos, prontosAgora}, primeiraLeitura);
          primeiraLeitura = false;
        }, error);
      },
      addPedido: async data => {
        const batch = writeBatch(db);
        const ref = doc(collection(db, 'pedidos'));
        batch.set(ref, data);
        if (data.temEstribo) batch.set(doc(db, 'fabricaPedidos', ref.id), resumoFabrica(data));
        await batch.commit();
        return ref.id;
      },
      updatePedido: async (id, data) => {
        const batch = writeBatch(db);
        batch.update(doc(db, 'pedidos', id), data);
        const publico = doc(db, 'fabricaPedidos', id);
        if (data.temEstribo) batch.set(publico, resumoFabrica(data), {merge:true});
        else batch.delete(publico);
        await batch.commit();
      },
      deletePedido: async id => {
        const batch = writeBatch(db);
        batch.delete(doc(db, 'pedidos', id));
        batch.delete(doc(db, 'fabricaPedidos', id));
        await batch.commit();
      },
      updateStatus: async (id, data, hasFactoryMirror = true) => {
        const batch = writeBatch(db);
        batch.update(doc(db, 'pedidos', id), data);
        if (hasFactoryMirror) batch.update(doc(db, 'fabricaPedidos', id), data);
        await batch.commit();
      },
      updateItemProgress: async (id, estribosProntos, retirarDePronto = false) => {
        const batch = writeBatch(db);
        const atualizacao = retirarDePronto ? {estribosProntos,pronto:false,prontoEm:null} : {estribosProntos};
        batch.update(doc(db, 'pedidos', id), atualizacao);
        batch.update(doc(db, 'fabricaPedidos', id), atualizacao);
        await batch.commit();
      }
    };
    window.dispatchEvent(new Event('firebase-ready'));
    onAuthStateChanged(auth, user => window.dispatchEvent(new CustomEvent('firebase-auth-state', {detail:{user}})));
  } catch (error) {
    console.error('Falha ao iniciar Firebase:', error);
    window.dispatchEvent(new CustomEvent('firebase-init-error', {detail:{message:error.message}}));
  }
</script>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */
const PECAS_POR_PACOTE = 500;
const MATERIAIS = ['3.8','4.2','5.0','6.0'];
const TELAS = [
  {codigo:'Q138 / EQ138', medida:'10 × 10 cm', bitola:'4,2 mm'},
  {codigo:'Q61 / EQ61', medida:'15 × 15 cm', bitola:'3,4 mm'},
  {codigo:'Q92 / EQ92', medida:'15 × 15 cm', bitola:'4,2 mm'},
  {codigo:'Q45 / EQ45', medida:'20 × 20 cm', bitola:'3,4 mm'}
];
function telaPorCodigo(valor){
  const texto = String(valor || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (!texto) return null;
  return TELAS.find(tela => tela.codigo.split('/').some(alias => {
    const chave = alias.replace(/[^A-Z0-9]/g,'');
    return chave && (texto === chave || texto.includes(chave));
  })) || null;
}

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  pedidos: [],
  clientes: [],
  editandoId: null,
  clienteAtual: '',
  itens: [],
  itemEditandoIndex: null,
  tipoItemAtual: 'estribo',
  role: null,
  pararPedidos: null,
  notificarTimer: null,
  notificacoesFila: [],
  prontosExpandidos: false,
  naoCaixaArame: false
};

const $ = s => document.querySelector(s);

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function classeBitola(material){
  const normalizada = String(material ?? '').trim().replace(',', '.');
  return ({'3.8':'bitola-38','4.2':'bitola-42','5.0':'bitola-50','6.0':'bitola-60'})[normalizada] || '';
}
function etiquetaBitola(material){
  return `<span class="tag-bitola ${classeBitola(material)}">${esc(String(material))} mm</span>`;
}
function fmtQtd(n){ return Number(n||0).toLocaleString('pt-BR'); }
function lerQuantidade(texto){
  const valor = String(texto ?? '').trim().replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(valor)) return NaN;
  return Number(valor);
}
function textoQtdOutro(item){
  const qtd = item.unidade === 'kg' ? fmtKg(item.qtd) : fmtQtd(item.qtd);
  const unidade = item.unidade === 'kg' ? 'kg' : 'un.';
  const caixas = item.caixas ? ` · ${fmtQtd(item.caixas)} caixa(s) de 20 kg` : '';
  const rolo = item.unidade === 'kg' && !item.caixas && !item.naoCaixa && tipoMaterialOutro(item.material) === 'arame' ? ' · rolo' : '';
  return `${qtd} ${unidade}${caixas}${rolo}`;
}
function fmtKg(n){ return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function dataLocalISO(data = new Date()){
  const ano = data.getFullYear();
  const mes = String(data.getMonth()+1).padStart(2,'0');
  const dia = String(data.getDate()).padStart(2,'0');
  return `${ano}-${mes}-${dia}`;
}
function formatarDataISO(valor){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(valor || ''))) return '';
  const [ano,mes,dia] = valor.split('-');
  return `${dia}/${mes}/${ano}`;
}
function dataEntradaDoPedido(pedido){
  if (pedido.dataEntrada) return pedido.dataEntrada;
  return pedido.criadoEm ? dataLocalISO(new Date(pedido.criadoEm)) : dataLocalISO();
}
function fmtData(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

$('#dataEntradaPedido').value = dataLocalISO();

/* REGRA DOS PACOTES: cada grupo de até 500 peças conta como 1 pacote.
   Grupos incompletos também contam como pacote (ex.: 501 peças = 2). */
function pacotesDe(qtd){
  qtd = Number(qtd) || 0;
  if (qtd <= 0) return 0;
  return Math.ceil(qtd / PECAS_POR_PACOTE);
}
/* ============================================================
   PERSISTÊNCIA
   ============================================================ */
function carregarClientes(){
  try{
    const clientes = JSON.parse(localStorage.getItem('estribos.clientes') || '[]');
    state.clientes = Array.isArray(clientes) ? clientes.filter(nome => typeof nome === 'string' && nome.trim()) : [];
  }catch(e){ state.clientes = []; }
}
function persistir(){
  try{
    localStorage.setItem('estribos.clientes', JSON.stringify(state.clientes));
  }catch(error){
    console.warn('Não foi possível guardar a lista local de clientes:', error);
  }
}
function mostrarNotificacao(titulo, texto, pedido){
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted'){
    try { new Notification(titulo, {body:texto, tag:`pedido-${pedido.id}`}); }
    catch(error){ console.warn('Notificação do navegador indisponível:', error); }
  }
  state.notificacoesFila.push(texto);
  if (state.notificarTimer) return;
  const exibirProxima = () => {
    const proxima = state.notificacoesFila.shift();
    if (!proxima){ state.notificarTimer = null; return; }
    const aviso = document.querySelector('#avisoNovoPedido');
    if (!aviso){ state.notificarTimer = null; return; }
    aviso.textContent = proxima;
    aviso.classList.add('visivel');
    state.notificarTimer = setTimeout(() => {
      aviso.classList.remove('visivel');
      state.notificarTimer = setTimeout(exibirProxima, 250);
    }, 7000);
  };
  exibirProxima();
}
function mostrarAvisoNovoPedido(pedido){
  mostrarNotificacao('Novo pedido para a fábrica', `Novo pedido de ${pedido.cliente || 'cliente'} chegou para a fábrica.`, pedido);
}
function mostrarAvisoPedidoPronto(pedido){
  mostrarNotificacao('Pedido pronto', `O pedido de ${pedido.cliente || 'cliente'} foi confirmado como pronto.`, pedido);
}
function atualizarEstadoNotificacoes(){
  const status = document.querySelector('#estadoNotificacoes');
  const botao = document.querySelector('#btnAtivarNotificacoes');
  if (!status || !botao) return;
  if (!('Notification' in window)){
    status.textContent = 'Avisos aparecem enquanto o app estiver aberto.';
    botao.hidden = true;
  } else if (Notification.permission === 'granted'){
    status.textContent = 'Notificações do navegador ativadas para novos pedidos e pedidos prontos.';
    botao.hidden = true;
  } else if (Notification.permission === 'denied'){
    status.textContent = 'Notificações bloqueadas pelo navegador; avisos aparecem nesta tela.';
    botao.hidden = true;
  } else {
    status.textContent = 'Ative para receber avisos de pedidos novos ou prontos neste aparelho.';
    botao.hidden = false;
  }
}
document.querySelector('#btnAtivarNotificacoes')?.addEventListener('click', async () => {
  if (!('Notification' in window)) return;
  try {
    await Notification.requestPermission();
    atualizarEstadoNotificacoes();
  } catch(error){
    console.warn('Não foi possível pedir permissão para notificações:', error);
  }
});
function ouvirPedidos(){
  if (state.pararPedidos) state.pararPedidos();
  state.pararPedidos = window.firebaseApi.listenPedidos(state.role, (pedidos, eventos, primeiraLeitura) => {
    state.pedidos = pedidos;
    render();
    if (primeiraLeitura) return;
    if (state.role === 'fabrica') eventos.novos.forEach(mostrarAvisoNovoPedido);
    if (state.role === 'lancamento') eventos.prontosAgora.forEach(mostrarAvisoPedidoPronto);
  }, error => {
    console.error('Falha ao carregar pedidos:', error);
    mostrarErroLogin('Não foi possível carregar os pedidos. Confira as regras do Firestore.');
  });
}
function mostrarErroLogin(mensagem){
  const erro = document.querySelector('#loginErro');
  if (erro){ erro.textContent = mensagem; erro.hidden = false; }
  if (document.body.classList.contains('autenticado')){
    const aviso = document.querySelector('#erroApp');
    if (aviso){ aviso.textContent = mensagem; aviso.hidden = false; setTimeout(() => { aviso.hidden = true; }, 9000); }
  }
}
function definirAcesso(user){
  if (state.pararPedidos){ state.pararPedidos(); state.pararPedidos = null; }
  state.pedidos = [];
  state.role = user
    ? (user.uid === 'K9kHfZDrN3hRnWaDss49efL4g0N2' ? 'lancamento'
      : user.uid === 'j4lP0mUvsXdwRGgpKuAejzzYqzz1' ? 'fabrica' : null)
    : null;
  if (!user){
    state.editandoId = null;
    state.itemEditandoIndex = null;
    state.clienteAtual = '';
    state.itens = [];
    state.naoCaixaArame = false;
    limparFormulario();
    document.body.classList.remove('autenticado','role-lancamento','role-fabrica');
    render();
    return;
  }
  if (!state.role){
    window.firebaseApi.signOut();
    mostrarErroLogin('Este usuário não está autorizado neste app.');
    return;
  }
  document.body.classList.add('autenticado');
  document.body.classList.toggle('role-lancamento', state.role === 'lancamento');
  document.body.classList.toggle('role-fabrica', state.role === 'fabrica');
  document.querySelector('#loginErro').hidden = true;
  const avisoErroApp = document.querySelector('#erroApp');
  if (avisoErroApp) avisoErroApp.hidden = true;
  document.querySelector('#loginEmail').value = '';
  document.querySelector('#loginSenha').value = '';
  document.querySelectorAll('.app-tab[data-tab]').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === (state.role === 'fabrica' ? 'fabrica' : 'pedidos')));
  document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === (state.role === 'fabrica' ? 'tab-fabrica' : 'tab-pedidos')));
  carregarClientes();
  atualizarClienteUI();
  atualizarDatalist();
  atualizarEstadoNotificacoes();
  ouvirPedidos();
}
window.addEventListener('firebase-ready', () => {
  const btn = document.querySelector('#btnEntrar');
  btn.disabled = false;
  btn.textContent = 'Entrar';
});
window.addEventListener('firebase-init-error', event => {
  document.querySelector('#btnEntrar').disabled = true;
  mostrarErroLogin('Firebase não iniciou: ' + (event.detail?.message || 'verifique conexão e configuração.'));
});
window.addEventListener('firebase-auth-state', event => definirAcesso(event.detail.user));
document.querySelector('#loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (!window.firebaseApi) return;
  const btn = document.querySelector('#btnEntrar');
  const email = document.querySelector('#loginEmail').value.trim();
  const senha = document.querySelector('#loginSenha').value;
  document.querySelector('#loginErro').hidden = true;
  btn.disabled = true; btn.textContent = 'Entrando...';
  try { await window.firebaseApi.signIn(email, senha); }
  catch (error) {
    const mensagem = error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password'
      ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar. Confira o e-mail, a senha e a conexão.';
    mostrarErroLogin(mensagem);
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
document.querySelector('#btnSair').addEventListener('click', () => window.firebaseApi?.signOut());
document.querySelector('#mostrarSenha').addEventListener('change', event => {
  document.querySelector('#loginSenha').type = event.target.checked ? 'text' : 'password';
});

function registrarCliente(nome){
  if (!state.clientes.some(c => c.toLowerCase() === nome.toLowerCase())) {
    state.clientes.push(nome);
    state.clientes.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }
}

/* ============================================================
   ABAS
   ============================================================ */
document.querySelectorAll('.app-tab').forEach(btn => {
  if (!btn.dataset.tab) return;
  btn.addEventListener('click', () => {
    if ((state.role === 'lancamento' && btn.dataset.tab !== 'pedidos') || (state.role === 'fabrica' && btn.dataset.tab !== 'fabrica')) return;
    document.querySelectorAll('.app-tab[data-tab]').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === 'tab-' + btn.dataset.tab));
    if (btn.dataset.tab === 'fabrica') renderFabrica();
  });
});

/* ============================================================
   CLIENTE (AUTOCOMPLETE · OBRIGATÓRIO)
   ============================================================ */
function clientesDisponiveis(){
  const nomes = [...state.clientes, ...state.pedidos.map(p => p.cliente)];
  const vistos = new Set();
  return nomes.map(n => String(n || '').trim()).filter(n => {
    if (!n) return false;
    const chave = n.toLocaleLowerCase('pt-BR');
    if (vistos.has(chave)) return false;
    vistos.add(chave);
    return true;
  }).sort((a,b) => a.localeCompare(b,'pt-BR'));
}
function ocultarSugestoesCliente(){
  const lista = $('#sugestoesClientes');
  lista.hidden = true;
  lista.innerHTML = '';
  $('#clienteBusca').setAttribute('aria-expanded','false');
}
function escolherCliente(nome){
  state.clienteAtual = String(nome || '').trim();
  $('#clienteBusca').value = state.clienteAtual;
  ocultarSugestoesCliente();
  registrarCliente(state.clienteAtual);
}
function normalizarBuscaCliente(valor){
  return String(valor || '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
}
function atualizarSugestoesCliente(mostrarTudo=false){
  const campo = $('#clienteBusca');
  const lista = $('#sugestoesClientes');
  const termo = normalizarBuscaCliente(campo.value);
  const nomes = clientesDisponiveis();
  const correspondencias = !termo && !mostrarTudo ? [] : nomes
    .map(nome => ({nome, busca:normalizarBuscaCliente(nome)}))
    .filter(item => !termo || item.busca.includes(termo))
    .sort((a,b) => {
      if (!termo) return a.nome.localeCompare(b.nome,'pt-BR');
      const aComeca = a.busca.startsWith(termo), bComeca = b.busca.startsWith(termo);
      return aComeca !== bComeca ? (aComeca ? -1 : 1) : a.nome.localeCompare(b.nome,'pt-BR');
    })
    .slice(0,8)
    .map(item => item.nome);
  lista.innerHTML = correspondencias.map((nome,idx) => `<button type="button" class="cliente-sugestao" role="option" aria-selected="false" data-cliente-index="${idx}">${esc(nome)}</button>`).join('');
  lista.hidden = correspondencias.length === 0;
  campo.setAttribute('aria-expanded', String(correspondencias.length > 0));
  lista.querySelectorAll('[data-cliente-index]').forEach(botao => {
    botao.addEventListener('mousedown', event => event.preventDefault());
    botao.addEventListener('click', () => escolherCliente(botao.textContent));
  });
}
function confirmarClienteDigitado(){
  const nome = $('#clienteBusca').value.trim();
  if (!nome){
    alert('Informe o nome do cliente para continuar.');
    $('#clienteBusca').focus();
    atualizarSugestoesCliente(true);
    return false;
  }
  escolherCliente(nome);
  return true;
}
function atualizarClienteUI(){ $('#clienteBusca').value = state.clienteAtual || ''; }
function atualizarDatalist(){
  if ($('#clienteBusca') && document.activeElement === $('#clienteBusca')) atualizarSugestoesCliente();
}
$('#clienteBusca').addEventListener('input', () => {
  state.clienteAtual = $('#clienteBusca').value.trim();
  atualizarSugestoesCliente();
});
$('#clienteBusca').addEventListener('focus', () => ocultarSugestoesCliente());
$('#clienteBusca').addEventListener('keydown', event => {
  const opcoes = [...$('#sugestoesClientes').querySelectorAll('[data-cliente-index]')];
  const selecionada = opcoes.findIndex(botao => botao.getAttribute('aria-selected') === 'true');
  if (event.key === 'ArrowDown' && opcoes.length){
    event.preventDefault(); const item = opcoes[Math.min(selecionada + 1, opcoes.length - 1)];
    opcoes.forEach(botao => botao.setAttribute('aria-selected', String(botao === item))); item.scrollIntoView({block:'nearest'});
  } else if (event.key === 'ArrowUp' && opcoes.length){
    event.preventDefault(); const item = opcoes[Math.max(selecionada - 1, 0)];
    opcoes.forEach(botao => botao.setAttribute('aria-selected', String(botao === item))); item.scrollIntoView({block:'nearest'});
  } else if (event.key === 'Enter'){
    event.preventDefault(); const item = opcoes.find(botao => botao.getAttribute('aria-selected') === 'true');
    if (item) escolherCliente(item.textContent); else confirmarClienteDigitado();
  } else if (event.key === 'Escape') ocultarSugestoesCliente();
});
document.addEventListener('click', event => { if (!event.target.closest('.cliente-autocomplete')) ocultarSugestoesCliente(); });

/* ============================================================
   ITENS DO PEDIDO (temporários)
   ============================================================ */
function tipoMaterialOutro(nome){
  const n = String(nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if (n.includes('arame')) return 'arame';
  if (n.includes('tela') || telaPorCodigo(nome)) return 'tela';
  if (n.includes('barra')) return 'barra';
  if (n.includes('bobina')) return 'bobina';
  return 'generico';
}
function atualizarRegraMaterial(){
  const tipo = tipoMaterialOutro($('#itemOutroNome').value);
  const selecionaUnidade = tipo === 'arame' || tipo === 'bobina';
  $('#campoUnidadeBobina').hidden = !selecionaUnidade;
  const unidadeEscolhida = $('#itemUnidadeBobina').value;
  const kg = selecionaUnidade && unidadeEscolhida === 'kg';
  if (tipo !== 'arame') state.naoCaixaArame = false;
  const label = $('#labelQtdItem');
  const qtd = $('#itemQtd');
  const ajuda = $('#ajudaMaterial');
  const naoCaixa = $('#btnNaoCaixa');
  if (naoCaixa){
    naoCaixa.hidden = tipo !== 'arame' || !kg;
    naoCaixa.setAttribute('aria-pressed', String(state.naoCaixaArame));
    naoCaixa.textContent = state.naoCaixaArame ? 'NÃO É CAIXA · ATIVO' : 'NÃO É CAIXA';
  }
  qtd.placeholder = kg ? '0,00' : '0';
  if (tipo === 'arame'){
    label.textContent = kg ? 'Peso em kg' : 'Quantidade de unidades';
    qtd.placeholder = kg ? 'Peso em kg' : 'Quantidade de unidades';
    ajuda.textContent = kg ? (state.naoCaixaArame ? 'Peso em kg, sem converter em caixa de 20 kg.' : 'A cada 20 kg exatos, conta 1 caixa; outros pesos contam como rolo.') : 'Informe a quantidade de unidades/rolos.';
    ajuda.hidden = false;
  } else if (tipo === 'tela'){
    label.textContent = 'Total de peças';
    qtd.placeholder = 'Total de peças';
    ajuda.textContent = 'Digite o código da tela: Q138, Q61, Q92 ou Q45.';
    ajuda.hidden = false;
  } else if (tipo === 'barra'){
    label.textContent = 'Quantidade de barras';
    qtd.placeholder = 'Quantidade de barras';
    ajuda.textContent = 'Somente por unidade.';
    ajuda.hidden = false;
  } else if (tipo === 'bobina'){
    label.textContent = unidadeEscolhida === 'kg' ? 'Peso em kg' : 'Quantidade de bobinas';
    qtd.placeholder = unidadeEscolhida === 'kg' ? 'Peso em kg' : 'Quantidade de bobinas';
    ajuda.textContent = unidadeEscolhida === 'kg' ? 'Informe o peso em kg.' : 'Quantidade por unidade.';
    ajuda.hidden = false;
  } else {
    label.textContent = 'Total de peças';
    qtd.placeholder = 'Total de peças';
    ajuda.hidden = true;
  }
  atualizarAjudaTela();
}
function atualizarAjudaTela(){
  const entrada = $('#itemOutroNome').value;
  const tela = telaPorCodigo(entrada);
  const ehTela = state.tipoItemAtual === 'outro' && (tipoMaterialOutro(entrada) === 'tela' || !!tela);
  const ajuda = $('#ajudaMaterial');
  if (ehTela){
    ajuda.textContent = tela ? `MEDIDA: ${tela.medida} · BITOLA: ${tela.bitola}` : 'DIGITE O CÓDIGO DA TELA: Q138, Q61, Q92 OU Q45.';
    ajuda.hidden = false;
  } else if (tipoMaterialOutro(entrada) === 'tela'){
    ajuda.textContent = 'DIGITE O CÓDIGO DA TELA: Q138, Q61, Q92 OU Q45.';
    ajuda.hidden = false;
  }
}
function infoTelaDoItem(item){
  if (!item || item.tipo !== 'outro') return null;
  const codigoSalvo = String(item.codigo || item.material || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const tela = TELAS.find(opcao => opcao.codigo.split('/').some(alias => {
    const chave = alias.replace(/[^A-Z0-9]/g,'');
    return chave && codigoSalvo.includes(chave);
  }));
  const ehTela = String(item.material || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes('tela') || !!tela;
  if (!ehTela || !tela) return null;
  const medidaSalva = String(item.medida || '').trim();
  return {codigo:tela.codigo, medida:!medidaSalva || medidaSalva === '—' ? tela.medida : medidaSalva, bitola:item.bitola || tela.bitola};
}

function addItem(){
  if (state.tipoItemAtual === 'outro'){
    const nome = $('#itemOutroNome').value.trim();
    const tipoMaterial = tipoMaterialOutro(nome);
    const quantidade = lerQuantidade($('#itemQtd').value);
    const unidade = (tipoMaterial === 'arame' || tipoMaterial === 'bobina') ? $('#itemUnidadeBobina').value : 'un';
    if (!nome){ alert('Informe o nome do material.'); $('#itemOutroNome').focus(); return; }
    if (!Number.isFinite(quantidade) || quantidade <= 0){ alert('Informe uma quantidade válida.'); $('#itemQtd').focus(); return; }
    if (unidade === 'un' && !Number.isInteger(quantidade)){
      alert('A quantidade por unidade deve ser um número inteiro.');
      $('#itemQtd').focus(); return;
    }
    const naoCaixa = tipoMaterial === 'arame' && unidade === 'kg' && state.naoCaixaArame;
    const caixas = tipoMaterial === 'arame' && unidade === 'kg' && !naoCaixa && Math.abs(quantidade / 20 - Math.round(quantidade / 20)) < 1e-9
      ? Math.round(quantidade / 20) : 0;
    const tela = tipoMaterial === 'tela' ? telaPorCodigo(nome) : null;
    if (tipoMaterial === 'tela' && !tela){
      alert('Digite o código da tela: Q138, Q61, Q92 ou Q45.');
      $('#itemOutroNome').focus();
      return;
    }
    const itemNovo = {tipo:'outro', medida:tela ? tela.medida : '—', material:tela ? 'Tela' : nome, codigo:tela?.codigo || '', bitola:tela?.bitola || '', qtd:quantidade, unidade, caixas, naoCaixa};
    if (state.itemEditandoIndex !== null) state.itens[state.itemEditandoIndex] = itemNovo;
    else state.itens.push(itemNovo);
    state.itemEditandoIndex = null;
    $('#btnAddItem').textContent = '+ ADICIONAR';
    $('#itemOutroNome').value = '';
    $('#itemQtd').value = '';
    $('#itemUnidadeBobina').value = 'un';
    state.naoCaixaArame = false;
    atualizarRegraMaterial();
    $('#itemOutroNome').focus();
    renderItensTemp();
    return;
  }
  const medida = $('#itemMedida').value.trim();
  const bitolaDigitada = $('#itemMaterial').value.trim().replace(',', '.');
  const material = MATERIAIS.includes(bitolaDigitada) ? bitolaDigitada : '';
  const qtd = lerQuantidade($('#itemQtd').value);

  if (!medida){ alert('Informe a MEDIDA.'); $('#itemMedida').focus(); return; }
  if (!material){
    alert('Bitola inválida. Digite somente: 3,8; 4,2; 5,0 ou 6,0 mm.');
    $('#itemMaterial').focus();
    return;
  }
  if (!Number.isFinite(qtd) || qtd <= 0 || !Number.isInteger(qtd)){
    alert('Informe a quantidade de peças com um número inteiro positivo.');
    $('#itemQtd').focus(); return;
  }

  const itemNovo = {tipo:'estribo', medida, material, qtd, pronto:false};
  if (state.itemEditandoIndex !== null) state.itens[state.itemEditandoIndex] = itemNovo;
  else state.itens.push(itemNovo);
  state.itemEditandoIndex = null;
  $('#btnAddItem').textContent = '+ ADICIONAR';
  $('#itemMedida').value = '';
  $('#itemMaterial').value = '';
  $('#itemOutroNome').value = '';
  $('#itemQtd').value = '';
  $('#itemMedida').focus();
  renderItensTemp();
}
$('#btnAddItem').addEventListener('click', addItem);

function renderItensTemp(){
  const ul = $('#listaItensTemp');
  if (!state.itens.length){ ul.innerHTML = ''; return; }
  ul.innerHTML = state.itens.map((it, idx) => `
    <li>
      <span>
        ${it.tipo === 'outro' ? `<span class="medida">${it.codigo ? `${esc(it.codigo)} · ${esc(it.medida)} · ${esc(it.bitola)}` : esc(it.material)}</span> · <b>${textoQtdOutro(it)}</b>` : `<span class="medida">${esc(it.medida)}</span> · ${etiquetaBitola(it.material)} · <b>${fmtQtd(it.qtd)} peças</b>`}
      </span>
      <span style="display:flex;gap:8px;align-items:center">
        ${it.tipo === 'outro' ? '' : `<span class="pac">${pacotesDe(it.qtd)} pct</span>`}
        <button type="button" class="item-editar" data-edit="${idx}" aria-label="Editar item ${idx + 1}">EDITAR</button>
        <button type="button" class="item-apagar-x" data-del="${idx}" aria-label="Apagar item ${idx + 1}" title="Apagar">×</button>
      </span>
    </li>`).join('');

  ul.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', () => editarItemTemporario(Number(b.dataset.edit)));
  });
  ul.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      const index = Number(b.dataset.del);
      state.itens.splice(index, 1);
      if (state.itemEditandoIndex === index) cancelarEdicaoItemTemporario();
      else if (state.itemEditandoIndex !== null && state.itemEditandoIndex > index) state.itemEditandoIndex--;
      renderItensTemp();
    });
  });
}
function editarItemTemporario(index){
  const item = state.itens[index];
  if (!item) return;
  state.itemEditandoIndex = index;
  if (item.tipo === 'outro'){
    state.tipoItemAtual = 'outro';
    $('#itemOutroNome').value = item.codigo || item.material;
    $('#itemUnidadeBobina').value = item.unidade || 'un';
    $('#itemQtd').value = String(item.qtd).replace('.', ',');
    state.naoCaixaArame = !!item.naoCaixa;
    selecionarTipoItem('outro');
    atualizarRegraMaterial();
    $('#itemOutroNome').focus();
  } else {
    selecionarTipoItem('estribo');
    $('#itemMedida').value = item.medida;
    $('#itemMaterial').value = item.material.replace('.', ',');
    $('#itemQtd').value = String(item.qtd);
    $('#itemMedida').focus();
  }
  $('#btnAddItem').textContent = 'ATUALIZAR ITEM';
}
function cancelarEdicaoItemTemporario(){
  state.itemEditandoIndex = null;
  state.naoCaixaArame = false;
  $('#btnAddItem').textContent = '+ ADICIONAR';
  $('#itemMedida').value = '';
  $('#itemMaterial').value = '';
  $('#itemOutroNome').value = '';
  $('#itemQtd').value = '';
  $('#itemUnidadeBobina').value = 'un';
  atualizarRegraMaterial();
}

$('#confirmarLancamentoDialog').addEventListener('close', () => $('#btnSalvar').focus());
async function confirmarESalvarLancamento(){
  if (!confirmarClienteDigitado()) return false;
  if (state.itemEditandoIndex !== null){
    alert('Atualize ou apague o item que está sendo editado antes de lançar o pedido.');
    return false;
  }
  if (!state.itens.length){
    alert('Adicione pelo menos 1 item (medida, material e quantidade).');
    return false;
  }

  const pedidoAnterior = state.editandoId
    ? state.pedidos.find(x => x.id === state.editandoId)
    : null;

  const itensSalvos = state.itens.map(i => ({...i}));
  const somenteEstoque = itensSalvos.length > 0 && itensSalvos.every(i => i.tipo === 'outro');
  const itensEstriboAntes = (pedidoAnterior?.itens || []).filter(i => i.tipo !== 'outro');
  const itensEstriboDepois = itensSalvos.filter(i => i.tipo !== 'outro');
  const mudouEstribos = JSON.stringify(itensEstriboAntes.map(({pronto,...item})=>item)) !== JSON.stringify(itensEstriboDepois.map(({pronto,...item})=>item));
  const estribosProntos = itensEstriboDepois.map((item,indice) => !mudouEstribos && (pedidoAnterior?.estribosProntos?.[indice] === true || (!Array.isArray(pedidoAnterior?.estribosProntos) && item.pronto === true)));
  let indiceEstriboSalvo = 0;
  itensSalvos.forEach(item => { if (item.tipo !== 'outro') item.pronto = estribosProntos[indiceEstriboSalvo++] === true; });
  const dataEntrada = $('#dataEntradaPedido').value;
  const pretensaoEntrega = $('#pretensaoEntrega').value;
  if (!dataEntrada){
    alert('Informe a data de entrada do pedido.');
    $('#dataEntradaPedido').focus();
    return;
  }
  if (pretensaoEntrega && pretensaoEntrega < dataEntrada){
    alert('A pretensão de entrega não pode ser anterior à data de entrada.');
    $('#pretensaoEntrega').focus();
    return;
  }

  const dados = {
    cliente: state.clienteAtual,
    criadoEm: pedidoAnterior?.criadoEm || Date.now(),
    dataEntrada,
    pretensaoEntrega,
    urgente: $('#urgente').checked,
    kg: pedidoAnterior ? (pedidoAnterior.kg || 0) : 0,
    obs: $('#anotacoesCliente').value.trim(),
    pronto: somenteEstoque || (itensEstriboDepois.length > 0 && estribosProntos.length === itensEstriboDepois.length && estribosProntos.every(Boolean)),
    estribosProntos,
    temEstribo: itensEstriboDepois.length > 0,
    prontoEm: somenteEstoque ? (pedidoAnterior?.prontoEm || Date.now()) : (itensEstriboDepois.length > 0 && estribosProntos.length === itensEstriboDepois.length && estribosProntos.every(Boolean) ? (pedidoAnterior?.pronto && !mudouEstribos ? (pedidoAnterior.prontoEm || Date.now()) : Date.now()) : null),
    entregue: pedidoAnterior?.entregue === true,
    entregueEm: pedidoAnterior?.entregueEm || null,
    itens: itensSalvos
  };

  try {
    if (state.editandoId){
      await window.firebaseApi.updatePedido(state.editandoId, dados);
    } else {
      await window.firebaseApi.addPedido({criadoEm:Date.now(), ...dados});
    }
    registrarCliente(state.clienteAtual);
    persistir();
    limparFormulario();
    return true;
  } catch(error) {
    console.error('Falha ao salvar pedido:', error);
    const detalhe = [error?.code, error?.message].filter(Boolean).join(' — ');
    alert('Não foi possível salvar o pedido no Firebase.' + (detalhe ? '\n\nDetalhe: ' + detalhe : ''));
    return false;
  }
}

async function excluirPedido(id){
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  if (state.role !== 'lancamento') return;
  if (!confirm('Excluir o lançamento do cliente "' + p.cliente + '"?')) return;
  try {
    await window.firebaseApi.deletePedido(id);
    if (state.editandoId === id) limparFormulario();
  } catch(error) {
    console.error('Falha ao excluir pedido:', error);
    alert('Não foi possível excluir. Confira as regras de acesso do Firestore.');
  }
}

/* ============================================================
   ORDENAÇÃO: urgentes primeiro; depois, ordem de chegada
   ============================================================ */
function ordenar(lista){
  return [...lista].sort((a,b) => {
    if (!!a.urgente !== !!b.urgente) return a.urgente ? -1 : 1;
    const chegadaA = Number(a.criadoEm) || 0;
    const chegadaB = Number(b.criadoEm) || 0;
    return chegadaA - chegadaB;
  });
}

   RENDER — ABA 2 (CHÃO DA FÁBRICA)

function renderFabrica(){
  const pedidosDeFabrica = state.pedidos.filter(p => !p.entregue && p.itens.some(i => i.tipo !== 'outro'));
  const emProducao = ordenar(pedidosDeFabrica.filter(p => !p.pronto));
  const concluidos = ordenar(pedidosDeFabrica.filter(p => p.pronto));
  const cont = $('#fabricaLista');

  const desenharPedidoFabrica = p => `
    <article class="fabrica-card ${p.pronto ? 'pronto' : (p.urgente ? 'urgente' : '')}">
      <div class="fabrica-top">
        <span class="fabrica-cliente">${esc(p.cliente)}</span>
        <span>
          ${p.urgente ? '<span class="tag-urgente">URGENTE</span>' : ''}
          <span class="fabrica-status ${p.pronto ? 'pronto' : ''}">${p.pronto ? 'PRONTO' : 'PRODUZINDO'}</span>
        </span>
      </div>
      <div class="pedido-datas">
        <div><b>Entrada:</b> ${formatarDataISO(dataEntradaDoPedido(p))}</div>
        ${p.pretensaoEntrega ? `<div><b>Entrega pretendida:</b> ${formatarDataISO(p.pretensaoEntrega)}</div>` : ''}
      </div>
      ${p.obs ? `<div class="fabrica-obs"><b>Anotações:</b> ${esc(p.obs)}</div>` : ''}
      <table class="tabela fabrica-tabela-estribos">
        <thead><tr><th>Medida</th><th>Bitola</th><th class="num">Peças/pct</th><th class="confirma-col">Pronto</th></tr></thead>
        <tbody>${p.itens.filter(i => i.tipo !== 'outro').map((i,indice) => `
          <tr class="${i.pronto ? 'estribo-confirmado' : ''}"><td><b>${esc(i.medida)}</b></td><td>${etiquetaBitola(i.material)}</td><td class="num">${fmtQtd(i.qtd)} / <b>${pacotesDe(i.qtd)}</b></td><td class="confirma-col"><button type="button" class="btn-confirmar-estribo ${i.pronto ? 'confirmado' : ''}" data-action="item-status" data-id="${esc(p.id)}" data-item-index="${indice}" aria-label="${i.pronto ? 'Desmarcar estribo pronto' : 'Marcar estribo pronto'}" aria-pressed="${i.pronto ? 'true' : 'false'}" title="${i.pronto ? 'Pronto' : 'Marcar como pronto'}">${i.pronto ? '✓' : ''}</button></td></tr>`).join('')}
        </tbody>
      </table>
      ${p.kg ? `<div class="fabrica-totais"><div><span>KG</span><strong>${fmtKg(p.kg)}</strong></div></div>` : ''}
      <div class="fabrica-acoes fabrica-progresso">${p.pronto ? 'PEDIDO CONFIRMADO COMO PRONTO.' : ((p.estribosProntos || p.itens.filter(i => i.tipo !== 'outro').map(i => i.pronto === true)).length > 0 && (p.estribosProntos || p.itens.filter(i => i.tipo !== 'outro').map(i => i.pronto === true)).every(Boolean) ? `<button type="button" class="sucesso btn-confirmar-pedido-pronto" data-action="confirm-order-ready" data-id="${esc(p.id)}">CONFIRMAR PEDIDO PRONTO</button>` : 'MARQUE CADA ESTRIBO. QUANDO TODOS ESTIVEREM MARCADOS, CONFIRME O PEDIDO.')}</div>
    </article>`;

  const desenharEtapa = (numero, titulo, lista) => `
    <section class="etapa-fabrica">
      <div class="etapa-fabrica-titulo">
        <span class="etapa-numero">${numero}</span>
        <h2>${titulo}</h2>
        <span class="etapa-contador">${lista.length}</span>
      </div>
      <div class="etapa-fabrica-lista">
        ${lista.length ? lista.map(desenharPedidoFabrica).join('') : '<p class="fabrica-vazio">Não há pedidos em produção.</p>'}
      </div>
    </section>`;

  const urgentes = emProducao.filter(p => p.urgente);
  const regulares = emProducao.filter(p => !p.urgente);
  const listaEmProducao = regulares;
  $('#fabricaResumo').innerHTML = `
    <div class="resumo-box"><span>1 · PRODUZINDO</span><strong>${regulares.length}</strong></div>
    <div class="resumo-box"><span>2 · URGENTES</span><strong>${urgentes.length}</strong></div>
    <div class="resumo-box"><span>3 · PRONTO</span><strong>${concluidos.length}</strong></div>`;
  const desenharUrgentes = lista => `
    <section class="etapa-fabrica etapa-urgentes">
      <div class="etapa-fabrica-titulo">
        <span class="etapa-numero">2</span>
        <h2>URGENTES</h2>
        <span class="etapa-contador">${lista.length}</span>
      </div>
      <div class="etapa-fabrica-lista">
        ${lista.length ? lista.map(desenharPedidoFabrica).join('') : '<p class="fabrica-vazio">NENHUM PEDIDO URGENTE.</p>'}
      </div>
    </section>`;
  const prontoDetalhes = concluidos.length
    ? concluidos.map(desenharPedidoFabrica).join('')
    : '<p class="fabrica-vazio">AINDA NÃO HÁ PEDIDOS PRONTOS.</p>';
  cont.innerHTML = `<div class="fabrica-etapas-verticais">
    ${desenharEtapa('1','Produzindo',listaEmProducao)}
    ${desenharUrgentes(urgentes)}
    <details class="etapa-prontos-recolhida" ${state.prontosExpandidos ? 'open' : ''}>
      <summary><span class="etapa-numero pronto-numero">3</span><span class="titulo-prontos">PRONTO</span><span class="etapa-contador">${concluidos.length}</span></summary>
      <div class="etapa-fabrica-lista lista-prontos">${prontoDetalhes}</div>
    </details>
  </div>`;
  const painelProntos = cont.querySelector('.etapa-prontos-recolhida');
  if (painelProntos) painelProntos.addEventListener('toggle', () => { state.prontosExpandidos = painelProntos.open; });
}

$('#listaPedidos').addEventListener('click', event => {
  const botao = event.target.closest('button[data-action][data-id]');
  if (!botao) return;
  const {action, id} = botao.dataset;
  if (action === 'editar') editarPedido(id);
  else if (action === 'entregue') registrarPedidoEntregue(id);
  else if (action === 'excluir') excluirPedido(id);
  else if (action === 'pdf') pdfPedido(id);
});
async function registrarPedidoEntregue(id){
  const pedido = state.pedidos.find(p => p.id === id);
  if (!pedido || state.role !== 'lancamento' || !pedido.pronto || pedido.entregue) return;
  try{
    await window.firebaseApi.updateStatus(id,{entregue:true,entregueEm:Date.now()},pedido.itens.some(item => item.tipo !== 'outro'));
  }catch(error){
    console.error('Falha ao marcar pedido como entregue:',error);
    alert('Não foi possível marcar o pedido como entregue. Confira a conexão e as regras do Firestore.');
  }
}

async function confirmarEstriboPronto(id, indice){
  const pedido = state.pedidos.find(item => item.id === id);
  if (!pedido || state.role !== 'fabrica') return;
  const estribos = pedido.itens.filter(atual => atual.tipo !== 'outro');
  if (!estribos[indice]) return;
  const estribosProntos = estribos.map((atual,i) => i === indice ? !Boolean(pedido.estribosProntos?.[i] ?? atual.pronto) : Boolean(pedido.estribosProntos?.[i] ?? atual.pronto));
  const retirarDePronto = pedido.pronto === true && !estribosProntos.every(Boolean);
  try{ await window.firebaseApi.updateItemProgress(id,estribosProntos,retirarDePronto); }
  catch(error){
    console.error('Falha ao confirmar estribo:',error);
    alert('Não foi possível atualizar a confirmação do estribo. Confira a conexão e as regras do Firestore.');
  }
}
async function confirmarPedidoPronto(id){
  const pedido = state.pedidos.find(item => item.id === id);
  if (!pedido || state.role !== 'fabrica' || pedido.pronto) return;
  const estribos = pedido.itens.filter(item => item.tipo !== 'outro');
  const marcados = pedido.estribosProntos || estribos.map(item => item.pronto === true);
  if (!estribos.length || marcados.length !== estribos.length || !marcados.every(Boolean)) return;
  try{ await window.firebaseApi.updateStatus(id,{pronto:true,prontoEm:Date.now()}); }
  catch(error){
    console.error('Falha ao confirmar pedido pronto:',error);
    alert('Não foi possível confirmar o pedido. Confira a conexão e as regras do Firestore.');
  }
}

$('#fabricaLista').addEventListener('click', event => {
  const botaoPedido = event.target.closest('button[data-action="confirm-order-ready"][data-id]');
  if (botaoPedido){ confirmarPedidoPronto(botaoPedido.dataset.id); return; }
  const itemBotao = event.target.closest('button[data-action="item-status"][data-id][data-item-index]');
  if (itemBotao) confirmarEstriboPronto(itemBotao.dataset.id, Number(itemBotao.dataset.itemIndex));
});

/* ============================================================
   PDF (impressão organizada e compacta)
   ============================================================ */
function montarHTMLPDF(lista, titulo){
  const agora = new Date().toLocaleString('pt-BR');
  const blocos = lista.map(p => {
    return `
    <div class="pdf-pedido ${p.urgente ? 'urgente' : ''}">
      <div class="pdf-pedido-top">
        <span class="pdf-cliente">${esc(p.cliente)}</span>
        ${p.urgente ? '<span class="pdf-urgente">URGENTE</span>' : ''}
        <span class="pdf-data">Entrada: ${formatarDataISO(dataEntradaDoPedido(p))}${p.pretensaoEntrega ? ` · Entrega: ${formatarDataISO(p.pretensaoEntrega)}` : ''} · Lançado: ${fmtData(p.criadoEm)}</span>
      </div>
      <table class="pdf-tab">
        <thead>
          <tr>
            <th>Medida</th>
            <th>Material</th>
            <th class="num">QTD (PÇ)</th>
            <th class="num">Pacotes</th>
            <th>KG</th>
          </tr>
        </thead>
        <tbody>
          ${p.itens.map(i => `
            <tr>
              <td>${i.tipo === 'outro' ? esc(infoTelaDoItem(i)?.medida || i.medida || '—') : esc(i.medida)}</td>
              <td>${i.tipo === 'outro' ? (infoTelaDoItem(i) ? `${esc(infoTelaDoItem(i).codigo)} · ${esc(infoTelaDoItem(i).bitola)}` : (i.codigo ? `${esc(i.codigo)} · ${esc(i.bitola)}` : esc(i.material))) : etiquetaBitola(i.material)}</td>
              <td class="num">${i.tipo === 'outro' ? textoQtdOutro(i) : fmtQtd(i.qtd)}</td>
              <td class="num">${i.tipo !== 'outro' ? pacotesDe(i.qtd) : ''}</td>
              <td class="kg-celula"><span class="pdf-kg-linha">&nbsp;</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="pdf-info">
        ${p.obs ? `<span><b>Anotações:</b> ${esc(p.obs)}</span>` : ''}
      </div>
      <div class="pdf-informacoes">
        <span class="pdf-informacoes-titulo">Informações:</span>
        <span class="pdf-informacoes-linha"></span>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pdf-header">
      <div>
        <div class="pdf-brand">ARAMES<span>BRASIL</span></div>
        <div class="pdf-title">${esc(titulo)}</div>
      </div>
      <div class="pdf-sub">
        DOCUMENTO OFICIAL<br>
        Emitido em ${esc(agora)}<br>
        ${lista.length} pedido(s) · ${PECAS_POR_PACOTE} peças por pacote
      </div>
    </div>
    ${blocos}
`;
}

function gerarPDF(lista, titulo){
  if (!lista.length){ alert('Nenhum pedido para imprimir.'); return; }
  $('#printArea').innerHTML = montarHTMLPDF(lista, titulo);
  setTimeout(() => window.print(), 80);
}
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

function pdfPedido(id){
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  gerarPDF([p], 'Pedido · ' + p.cliente);
}

$('#btnPDFGeral').addEventListener('click', () => {
  gerarPDF(ordenar(state.pedidos.filter(p => !p.entregue)), 'Relação Completa de Pedidos · Estribos');
});

carregarClientes();
atualizarClienteUI();
atualizarDatalist();
renderItensTemp();
selecionarTipoItem('estribo');
render();
