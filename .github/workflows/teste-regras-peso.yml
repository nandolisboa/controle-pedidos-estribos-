name: Testar regras peso com emulador
on:
  push:
    branches: [teste-conferencia-mlivre]
    paths: ['regra-teste.zip', '.github/workflows/teste-regras-peso.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir test && unzip -q regra-teste.zip -d test
      - run: npm install --no-audit --no-fund
        working-directory: test
      - run: npx firebase emulators:exec --project demo-peso-mlivre --only firestore 'node test.mjs'
        working-directory: test
