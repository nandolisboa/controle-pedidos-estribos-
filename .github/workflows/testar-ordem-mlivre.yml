name: Testar ordenacao M.Livre
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/testar-ordem-mlivre.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar fonte
        run: |
          echo '8b98ac7a3bfbc193d7644ad1b9a4ac8359a9ae918c8575ec2224b374cd8b5442  pedidos-mlivre-atualizado.zip' | sha256sum -c
          mkdir app
          unzip -q pedidos-mlivre-atualizado.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo
        working-directory: app
        run: bun run lint
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
