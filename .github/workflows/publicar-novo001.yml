name: Publicar lancamento-novo001
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-novo001.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto aprovado
        uses: actions/checkout@v4
        with:
          repository: nandolisboa/lancamento-novo001
          ref: ba0bcc68f74fb100bcbf536958a4ee3763cdec52
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Corrigir caminho da logo para GitHub Pages
        run: sed -i 's|src="/logo-arames.png"|src={`${import.meta.env.BASE_URL}logo-arames.png`}|g' src/components/LoginScreen.tsx
      - run: bun install --frozen-lockfile
      - run: bun run build --base /controle-pedidos-estribos-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
