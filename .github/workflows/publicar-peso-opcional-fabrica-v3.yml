name: Peso opcional lançado pela fábrica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-peso-opcional-fabrica-v3.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar fonte aprovada
        run: |
          echo 'fd4940a9d04d53fb385fd9791671ecbb8c17ed9e1c9ed0de2bcb232fde6efc99  factory-optional-kg-v3.zip' | sha256sum -c
          mkdir app
          unzip -q factory-optional-kg-v3.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar tipos
        working-directory: app
        run: bun run lint
      - name: Confirmar peso opcional na fábrica e leitura em Lançamentos
        working-directory: app
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          factory = Path("src/components/FactoryView.tsx").read_text()
          order_card = Path("src/components/OrderCard.tsx").read_text()
          app = Path("src/App.tsx").read_text()
          assert "Kg opcional" in factory and "onSaveItemWeight" in factory
          assert "(!mLivreMode || allWeightsEntered)" in factory
          assert "onSaveItemWeight(p.id, originalIndex" in factory
          assert "factoryWeightIndex" in order_card
          assert "pesoKgPorItem.f${itemIndex}" in Path("src/firebase.ts").read_text()
          assert "showItemWeights" in app and "Kg lançado" in order_card
          assert "onSaveItemWeight" not in order_card
          PYCODE
      - name: Testar status da producao
        working-directory: app
        run: |
          bun -e '
          import { estadoProducaoPedido } from "./src/utils.ts";
          const make = (pronto, estribosProntos, itens) => ({ pronto, estribosProntos, itens });
          const item = (pronto = false) => ({ tipo: "estribo", medida: "15 x 20", material: "4.2", qtd: 500, pronto });
          const expected = make(false, [false, false], [item(), item()]);
          const partial = make(false, [true, false], [item(true), item()]);
          const ready = make(true, [true, true], [item(true), item(true)]);
          const legacyPartial = make(false, undefined, [item(true), item(false)]);
          if (estadoProducaoPedido(expected) !== "esperado") throw new Error("Esperado incorreto");
          if (estadoProducaoPedido(partial) !== "produzindo") throw new Error("Produzindo incorreto");
          if (estadoProducaoPedido(ready) !== "pronto") throw new Error("Pronto incorreto");
          if (estadoProducaoPedido(legacyPartial) !== "produzindo") throw new Error("Compatibilidade com pedido antigo falhou");
          '
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
