name: Testar impressao producao
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/testar-imprimir-producao.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar fonte
        run: |
          echo 'ef1f72a1c4075a79992948f01b5976a3b395469877bddadf747f751292b3df92  pedidos-imprimir-producao-v6.zip' | sha256sum -c
          mkdir app
          unzip -q pedidos-imprimir-producao-v6.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo
        working-directory: app
        run: bun run lint
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
