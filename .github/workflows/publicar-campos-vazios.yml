name: Publicar campos sem exemplos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-campos-vazios.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar a fonte
        run: |
          echo '64f3652608c16a26cd5a97280e421a82f81f70d15f4c4d1c158648b09d1f6a0e  pedidos-sem-exemplos.zip' | sha256sum -c
          mkdir app
          unzip -q pedidos-sem-exemplos.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo
        working-directory: app
        run: bun run lint
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
