name: Publicar ordenacao M.Livre
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-ordem-mlivre.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar fonte
        run: |
          echo '8b98ac7a3bfbc193d7644ad1b9a4ac8359a9ae918c8575ec2224b374cd8b5442  pedidos-mlivre-atualizado.zip' | sha256sum -c
          mkdir app
          unzip -q pedidos-mlivre-atualizado.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo
        working-directory: app
        run: bun run lint
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
