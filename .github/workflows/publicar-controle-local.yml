name: Publicar controle de pedidos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-controle-local.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Conferir e preparar a fonte
        run: |
          echo '0d704e8cb51e550c11f4b686c597a74a253dfc4d2e94b2c67b29da5345dcec63  conferencia-fonte.zip' | sha256sum -c
          mkdir app
          unzip -q conferencia-fonte.zip -d app
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo
        working-directory: app
        run: bun run lint
      - name: Compilar
        working-directory: app
        run: bun run build --base /controle-pedidos-estribos-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
